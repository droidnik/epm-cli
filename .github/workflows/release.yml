name: release

# Push a tag like v0.2.0 to build and publish everything:
#   git tag v0.2.0 && git push origin v0.2.0
#
#   job "binaries" (macOS runner, needed for pkgbuild):
#     GitHub release with macOS .tar.gz/.zip/.pkg, Windows .zip, Linux .tar.gz/.deb/.rpm/.apk,
#     install.sh, install.ps1 and checksums.txt
#   job "image" (Linux runner):
#     multi-arch container image ghcr.io/<owner>/epm-cli:<version> and :latest
#
# Optional macOS signing + notarization — enabled only when these repository secrets exist:
#   MACOS_CERTS_P12          base64 of a .p12 with "Developer ID Application" + "Developer ID Installer"
#   MACOS_CERTS_PASSWORD     password of that .p12
#   CODESIGN_IDENTITY        e.g. "Developer ID Application: Example Corp (TEAMID)"
#   PKG_SIGN_IDENTITY        e.g. "Developer ID Installer: Example Corp (TEAMID)"
#   NOTARY_KEY_P8            base64 of an App Store Connect API key (.p8)   (optional)
#   NOTARY_KEY_ID, NOTARY_ISSUER                                            (optional)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: macos-latest
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import signing certificates
        if: env.MACOS_CERTS_P12 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/certs.p12" -P "$P12_PASSWORD" -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
          echo "CODESIGN_IDENTITY=${{ secrets.CODESIGN_IDENTITY }}" >> "$GITHUB_ENV"
          echo "PKG_SIGN_IDENTITY=${{ secrets.PKG_SIGN_IDENTITY }}" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.NOTARY_KEY_P8 != ''
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER=${{ secrets.NOTARY_ISSUER }}" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/epm-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
