# GoReleaser config — builds all release artifacts when a tag v* is pushed
# (see .github/workflows/release.yml). Local test without publishing:
#   make snapshot
#
# Artifacts:
#   macOS    epm-cli_<v>_darwin_all.tar.gz / .zip   universal binary (Intel + Apple Silicon)
#            epm-cli_<v>_darwin_all.pkg             installer → /usr/local/bin (scripts/build-pkg.sh)
#   Windows  epm-cli_<v>_windows_amd64.zip          + install.ps1
#   Linux    epm-cli_<v>_linux_{amd64,arm64}.tar.gz, .deb, .rpm, .apk
#   Docker   ghcr.io/droidnik/epm-cli               (separate job, see Dockerfile)
version: 2

project_name: epm-cli

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh scripts/completions.sh
    - sh scripts/notices.sh

builds:
  - id: epm-cli
    main: ./cmd/epm-cli
    binary: epm-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/droidnik/epm-cli/internal/cli.Version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

# One macOS binary for Intel and Apple Silicon; the post hook builds the .pkg
# (and signs/notarizes it when the signing variables are set).
universal_binaries:
  - id: epm-cli
    replace: true
    hooks:
      post:
        - cmd: sh scripts/build-pkg.sh "{{ .Path }}" "{{ .Version }}" dist
          output: true

archives:
  - id: default
    # epm-cli_<version>_darwin_all.tar.gz, epm-cli_<version>_linux_amd64.tar.gz, …
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "all" }}all{{ else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: darwin
        formats: [tar.gz, zip]
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES
      - completions/*

nfpms:
  - id: linux-packages
    package_name: epm-cli
    file_name_template: "{{ .ConventionalFileName }}"
    homepage: https://github.com/droidnik/epm-cli
    maintainer: Niklas Arhöfer
    license: MIT
    description: Command-line interface for the BeyondTrust EPM for Windows and Mac Management API.
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/epm-cli/LICENSE
      - src: THIRD_PARTY_NOTICES
        dst: /usr/share/doc/epm-cli/THIRD_PARTY_NOTICES
      - src: completions/epm-cli.bash
        dst: /usr/share/bash-completion/completions/epm-cli
      - src: completions/epm-cli.zsh
        dst: /usr/share/zsh/vendor-completions/_epm-cli
      - src: completions/epm-cli.fish
        dst: /usr/share/fish/vendor_completions.d/epm-cli.fish

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./dist/*.pkg

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: droidnik
    name: epm-cli
  draft: false
  prerelease: auto
  extra_files:
    - glob: ./dist/*.pkg
    - glob: ./install.sh
    - glob: ./install.ps1
